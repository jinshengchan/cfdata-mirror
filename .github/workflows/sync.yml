name: Sync from baipiao.eu.org

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream files
        run: |
          set -e
          curl -sf --max-time 60 https://www.baipiao.eu.org/cloudflare/ips-v4 -o ips-v4.txt
          curl -sf --max-time 60 https://www.baipiao.eu.org/cloudflare/ips-v6 -o ips-v6.txt
          curl -sf --max-time 60 https://www.baipiao.eu.org/cloudflare/url -o url.txt
          curl -sf --max-time 60 https://www.baipiao.eu.org/cloudflare/locations -o locations.json
          head -c 200 ips-v4.txt
      - name: Commit if changed
        run: |
          git config user.name "jinshengchan"
          git config user.email "jinshengchan@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync: $(date -u +%F) from baipiao.eu.org"
          git push
